<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Power Forward">
<meta name="theme-color" content="#1a1f2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Power Forward</title>
<style>
:root{
  --navy:#1a1f2e;--navy2:#242938;--navy3:#2e3447;
  --teal:#2dd4bf;--teal2:#14b8a6;--slate:#94a3b8;
  --light:#e2e8f0;--white:#f8fafc;--amber:#f59e0b;
  --red:#f87171;--green:#4ade80;--green2:#22c55e;
  --radius:12px;--radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--navy);color:var(--light);min-height:100vh;min-height:100dvh;overflow-x:hidden}

/* AUTH */
#auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;background:linear-gradient(160deg,#1a1f2e 0%,#0f172a 100%)}
.auth-logo{font-size:48px;margin-bottom:8px}
.auth-title{font-size:30px;font-weight:700;color:var(--white);letter-spacing:-0.5px;margin-bottom:4px}
.auth-sub{font-size:14px;color:var(--slate);margin-bottom:2rem;text-align:center}
.auth-card{background:var(--navy2);border:1px solid var(--navy3);border-radius:var(--radius);padding:1.75rem;width:100%;max-width:360px}
.auth-card-title{font-size:16px;font-weight:600;color:var(--white);margin-bottom:1.25rem;text-align:center}
.user-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
.user-btn{background:var(--navy3);border:1.5px solid transparent;border-radius:var(--radius);padding:16px 10px;cursor:pointer;text-align:center;transition:all 0.15s;font-family:var(--font)}
.user-btn:hover,.user-btn.selected{border-color:var(--teal);background:rgba(45,212,191,0.1)}
.user-avatar-lg{width:44px;height:44px;border-radius:50%;background:var(--teal);color:var(--navy);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.user-name{font-size:14px;font-weight:500;color:var(--white)}
.user-role{font-size:11px;color:var(--slate);margin-top:2px}
.pin-section{margin-top:1rem}
.pin-label{font-size:12px;color:var(--slate);text-align:center;margin-bottom:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:16px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy3);transition:all 0.15s}
.pin-dot.filled{background:var(--teal);border-color:var(--teal)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pin-key{padding:14px;background:var(--navy3);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);color:var(--white);font-size:20px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all 0.1s;text-align:center}
.pin-key:active{background:var(--teal);color:var(--navy);transform:scale(0.95)}
.auth-msg{font-size:13px;margin-top:12px;text-align:center;min-height:20px}
.auth-msg.error{color:var(--red)}
.auth-msg.info{color:var(--teal)}
.btn-link{background:none;border:none;color:var(--slate);font-size:12px;cursor:pointer;font-family:var(--font);margin-top:12px;display:block;text-align:center;width:100%;text-decoration:underline}

/* APP SHELL */
#app{display:none;flex-direction:column;height:100vh;height:100dvh}
.app-header{background:var(--navy2);border-bottom:1px solid var(--navy3);padding:calc(var(--safe-top) + 12px) 1rem 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.app-header-left{display:flex;align-items:center;gap:10px}
.app-title{font-size:17px;font-weight:700;color:var(--white);letter-spacing:-0.3px}
.today-badge{display:flex;align-items:center;gap:4px;background:var(--navy3);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--teal)}
.page-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem;padding-bottom:calc(80px + var(--safe-bot))}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy2);border-top:1px solid var(--navy3);display:flex;padding-bottom:var(--safe-bot);z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;border:none;background:transparent;color:var(--slate);font-size:10px;font-weight:500;cursor:pointer;font-family:var(--font);gap:4px;transition:color 0.15s}
.nav-item.active{color:var(--teal)}
.nav-icon{font-size:20px;line-height:1}

/* PROFILE DROPDOWN */
.profile-pill{display:flex;align-items:center;gap:6px;background:var(--navy3);border:none;border-radius:20px;padding:5px 10px 5px 6px;cursor:pointer;color:var(--light);font-size:13px;font-weight:500;font-family:var(--font)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--teal);color:var(--navy);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dropdown{position:absolute;top:calc(var(--safe-top) + 52px);right:1rem;background:var(--navy2);border:1px solid var(--navy3);border-radius:var(--radius);overflow:hidden;z-index:200;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,0.4);display:none}
.dropdown.open{display:block}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:14px;color:var(--light);cursor:pointer;border:none;background:transparent;width:100%;font-family:var(--font);text-align:left;transition:background 0.1s}
.dropdown-item:hover{background:var(--navy3)}
.dropdown-item.danger{color:var(--red)}

/* CARDS */
.card{background:var(--navy2);border:1px solid var(--navy3);border-radius:var(--radius);padding:1.1rem;margin-bottom:0.75rem}
.card-title{font-size:13px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.75rem}

/* TODAY HERO */
.today-hero{background:linear-gradient(135deg,var(--navy2) 0%,#1e2d3d 100%);border:1px solid var(--navy3);border-radius:var(--radius);padding:1.25rem;margin-bottom:0.75rem}
.today-date{font-size:12px;color:var(--slate);margin-bottom:4px}
.today-workout{font-size:22px;font-weight:700;color:var(--white);letter-spacing:-0.4px;margin-bottom:4px}
.today-goal{font-size:12px;margin-bottom:0}

/* EXERCISE CARDS WITH CHECKBOX */
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--slate);margin:1rem 0 0.5rem;display:flex;align-items:center;gap:6px}
.section-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.ex-card{background:var(--navy3);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:all 0.15s;border:1.5px solid transparent}
.ex-card:hover{border-color:rgba(255,255,255,0.08)}
.ex-card.checked{background:rgba(45,212,191,0.08);border-color:rgba(45,212,191,0.25)}

.ex-checkbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--navy3);background:var(--navy2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;margin-top:1px}
.ex-card.checked .ex-checkbox{background:var(--teal);border-color:var(--teal)}
.ex-check-icon{font-size:12px;color:var(--navy);display:none}
.ex-card.checked .ex-check-icon{display:block}

.ex-body{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:500;color:var(--white);margin-bottom:2px}
.ex-card.checked .ex-name{color:var(--teal)}
.ex-meta{font-size:12px;color:var(--slate)}
.ex-notes{font-size:11px;color:var(--teal);margin-top:5px;padding:5px 8px;background:rgba(45,212,191,0.07);border-radius:6px;border-left:2px solid var(--teal2);line-height:1.4}

/* SESSION PROGRESS BAR */
.session-progress{background:var(--navy2);border:1px solid var(--navy3);border-radius:var(--radius);padding:1rem;margin-bottom:0.75rem}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-title{font-size:13px;font-weight:500;color:var(--light)}
.progress-count{font-size:13px;font-weight:600;color:var(--teal)}
.progress-bar-track{height:6px;background:var(--navy3);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--teal);border-radius:3px;transition:width 0.3s ease}

/* WEEK */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:0.75rem}
.week-label{flex:1;font-size:13px;font-weight:500;color:var(--light);text-align:center}
.icon-btn{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--navy3);background:var(--navy2);color:var(--light);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color 0.15s}
.icon-btn:hover{border-color:var(--teal)}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:0.75rem}
.day-cell{border-radius:var(--radius-sm);border:1px solid var(--navy3);padding:6px 2px;text-align:center;cursor:pointer;background:var(--navy2);transition:all 0.15s}
.day-cell:hover{border-color:var(--teal)}
.day-cell.today{border-color:var(--teal);background:rgba(45,212,191,0.08)}
.day-cell.has-activity{background:rgba(74,222,128,0.1);border-color:rgba(74,222,128,0.3)}
.day-cell.selected{border-color:var(--teal);border-width:2px}
.day-abbr{font-size:9px;color:var(--slate);margin-bottom:2px}
.day-num{font-size:14px;font-weight:600;color:var(--white)}
.day-count{font-size:9px;color:var(--green);margin-top:2px;font-weight:600}

/* PLANNER */
.planner-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--navy3)}
.planner-row:last-child{border-bottom:none}
.planner-day{font-size:13px;font-weight:500;color:var(--slate);min-width:36px}
.planner-select{flex:1;background:var(--navy3);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);color:var(--light);font-size:13px;font-family:var(--font);padding:7px 10px;outline:none}
.planner-select:focus{border-color:var(--teal)}

/* LIBRARY */
.lib-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:0.75rem}
.stat-box{background:var(--navy2);border:1px solid var(--navy3);border-radius:var(--radius);padding:12px 8px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--teal)}
.stat-lbl{font-size:10px;color:var(--slate);margin-top:2px;text-transform:uppercase;letter-spacing:0.05em}
.cat-header{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--teal);padding:10px 0 6px;border-bottom:1px solid var(--navy3);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.lib-ex-row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);margin-bottom:4px;background:var(--navy3);transition:opacity 0.15s}
.lib-ex-row.inactive{opacity:0.4}
.lib-ex-info{flex:1}
.lib-ex-name{font-size:13px;font-weight:500;color:var(--white)}
.lib-ex-meta{font-size:11px;color:var(--slate);margin-top:2px}
.toggle-btn{padding:3px 8px;border-radius:4px;border:1px solid;font-size:10px;font-weight:600;cursor:pointer;font-family:var(--font);white-space:nowrap;flex-shrink:0;transition:all 0.15s}
.toggle-btn.active-ex{border-color:var(--green);color:var(--green);background:rgba(74,222,128,0.1)}
.toggle-btn.inactive-ex{border-color:var(--slate);color:var(--slate);background:transparent}

/* PROGRESS */
.prog-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:0.75rem}
.period-tabs{display:flex;gap:4px;background:var(--navy3);border-radius:var(--radius-sm);padding:4px;margin-bottom:0.75rem}
.period-tab{flex:1;padding:7px;border:none;border-radius:6px;background:transparent;color:var(--slate);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all 0.15s}
.period-tab.active{background:var(--teal);color:var(--navy)}
.ex-history-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--navy3);font-size:13px}
.ex-history-row:last-child{border-bottom:none}
.ex-history-name{color:var(--white);font-weight:500;flex:1}
.ex-history-count{color:var(--teal);font-weight:600;font-size:13px;min-width:60px;text-align:right}
.ex-history-bar{height:4px;background:var(--navy3);border-radius:2px;margin-top:3px;overflow:hidden}
.ex-history-bar-fill{height:100%;background:var(--teal);border-radius:2px}
.activity-day-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--navy3);font-size:13px}
.activity-day-row:last-child{border-bottom:none}

/* FORMS */
.btn-sm{padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--navy3);background:var(--navy3);color:var(--light);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all 0.15s}
.btn-sm:hover{border-color:var(--teal);color:var(--teal)}
.btn-teal{background:var(--teal);color:var(--navy);border-color:var(--teal)}
.btn-teal:hover{opacity:0.85;color:var(--navy)}
.btn-primary{width:100%;padding:13px;background:var(--teal);color:var(--navy);border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);transition:opacity 0.15s;margin-top:4px}
.btn-primary:hover{opacity:0.9}
.admin-form{display:flex;flex-direction:column;gap:10px}
.admin-form input,.admin-form select,.admin-form textarea{width:100%;padding:10px 12px;background:var(--navy3);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);color:var(--white);font-size:14px;font-family:var(--font);outline:none}
.admin-form input:focus,.admin-form select:focus,.admin-form textarea:focus{border-color:var(--teal)}
.admin-form textarea{resize:vertical;min-height:60px}
.log-area{width:100%;background:var(--navy3);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);color:var(--light);font-size:14px;font-family:var(--font);padding:10px 12px;resize:vertical;min-height:80px;outline:none;line-height:1.5}
.log-area:focus{border-color:var(--teal)}
.import-zone{border:1.5px dashed var(--navy3);border-radius:var(--radius);padding:1.5rem;text-align:center;cursor:pointer;margin-bottom:0.75rem;transition:border-color 0.15s}
.import-zone:hover{border-color:var(--teal)}

/* MISC */
.loading{display:flex;align-items:center;justify-content:center;height:120px;color:var(--slate);font-size:14px;gap:8px}
.spinner{width:16px;height:16px;border:2px solid var(--navy3);border-top-color:var(--teal);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rest-card{text-align:center;padding:2.5rem 1rem;color:var(--slate)}
.rest-emoji{font-size:48px;margin-bottom:12px}
.empty-state{text-align:center;padding:2rem;color:var(--slate);font-size:14px}
.toast{position:fixed;bottom:calc(80px + var(--safe-bot) + 12px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy2);border:1px solid var(--navy3);border-radius:20px;padding:8px 16px;font-size:13px;color:var(--light);opacity:0;transition:all 0.25s;z-index:300;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-logo">⚡</div>
  <div class="auth-title">Power Forward</div>
  <div class="auth-sub">Strength · Flexibility · Agility</div>
  <div class="auth-card">
    <div class="auth-card-title" id="auth-card-title">Who's working out?</div>
    <div class="user-grid" id="user-grid">
      <div class="loading"><div class="spinner"></div></div>
    </div>
    <div class="pin-section" id="pin-section" style="display:none">
      <div class="pin-label" id="pin-label">Enter your PIN</div>
      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
      </div>
      <div class="pin-pad">
        <button class="pin-key" onclick="pinPress('1')">1</button>
        <button class="pin-key" onclick="pinPress('2')">2</button>
        <button class="pin-key" onclick="pinPress('3')">3</button>
        <button class="pin-key" onclick="pinPress('4')">4</button>
        <button class="pin-key" onclick="pinPress('5')">5</button>
        <button class="pin-key" onclick="pinPress('6')">6</button>
        <button class="pin-key" onclick="pinPress('7')">7</button>
        <button class="pin-key" onclick="pinPress('8')">8</button>
        <button class="pin-key" onclick="pinPress('9')">9</button>
        <button class="pin-key" onclick="pinDel()">⌫</button>
        <button class="pin-key" onclick="pinPress('0')">0</button>
        <button class="pin-key" onclick="pinClear()">✕</button>
      </div>
      <div class="auth-msg" id="auth-msg"></div>
      <button class="btn-link" onclick="backToUsers()">← Back</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="app-header-left">
      <span style="font-size:20px">⚡</span>
      <span class="app-title">Power Forward</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="today-badge">✓ <span id="done-count">0</span> today</div>
      <button class="profile-pill" onclick="toggleDropdown()" id="profile-btn">
        <div class="avatar" id="user-avatar">?</div>
        <span id="user-name-display">—</span>
      </button>
    </div>
  </div>
  <div class="dropdown" id="dropdown">
    <button class="dropdown-item" onclick="showChangePin()" id="change-pin-item">🔑 Change PIN</button>
    <button class="dropdown-item" onclick="showAdminPanel()" id="admin-menu-item" style="display:none">⚙️ Manage library</button>
    <button class="dropdown-item" onclick="showAddUser()" id="add-user-item" style="display:none">👤 Add family member</button>
    <button class="dropdown-item danger" onclick="handleSignOut()">↩ Switch user</button>
  </div>
  <div class="page-content" id="page-content">
    <div class="loading"><div class="spinner"></div> Loading…</div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showTab('today')" id="nav-today"><span class="nav-icon">📋</span>Today</button>
    <button class="nav-item" onclick="showTab('week')" id="nav-week"><span class="nav-icon">📅</span>Week</button>
    <button class="nav-item" onclick="showTab('planner')" id="nav-planner"><span class="nav-icon">✏️</span>Planner</button>
    <button class="nav-item" onclick="showTab('library')" id="nav-library"><span class="nav-icon">📚</span>Library</button>
    <button class="nav-item" onclick="showTab('progress')" id="nav-progress"><span class="nav-icon">📈</span>Progress</button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL='https://jerkvuymqzpsahsmoimw.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Implcmt2dXltcXpwc2Foc21vaW13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzI0NDksImV4cCI6MjEwMDkwODQ0OX0.UH--Bz5I9TXHw1JVyzsX6j7q7Oe6KNF1huQWYRCYNSI';

async function sbFetch(path,opts={}){
  const res=await fetch(SB_URL+path,{...opts,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':opts.prefer||'',...(opts.headers||{})}});
  if(!res.ok&&res.status!==204){const e=await res.text();throw new Error(e);}
  if(res.status===204)return null;
  return res.json();
}
async function sbGet(table,params=''){return sbFetch('/rest/v1/'+table+'?'+params);}
async function sbPost(table,body,prefer=''){return sbFetch('/rest/v1/'+table,{method:'POST',prefer,headers:prefer?{'Prefer':prefer}:{},body:JSON.stringify(body)});}
async function sbDelete(table,params){return sbFetch('/rest/v1/'+table+'?'+params,{method:'DELETE'});}
async function sbPatch(table,params,body){return sbFetch('/rest/v1/'+table+'?'+params,{method:'PATCH',body:JSON.stringify(body)});}

// ── STATE ─────────────────────────────────────────────────
let currentUser=null,allUsers=[],selectedUserId=null,pinEntry='';
let exerciseLibrary={},todayCompletions={},allCompletions=[],plannerOverrides={},sessionLogs={};
let weekOffset=0,selectedDay=null,currentTab='today',progressPeriod=7;

const SCHEDULE=['strength_lower','aerobic','upper_push','rest','upper_pull','rest','aerobic'];
const WORKOUT_META={
  strength_lower:{name:'Lower body strength',goal:'Glutes · Hips · Single-leg balance',color:'#4ade80'},
  aerobic:{name:'Aerobic session',goal:'Cardio · Endurance · Active recovery',color:'#60a5fa'},
  upper_push:{name:'Upper body — push',goal:'Chest · Shoulders · Triceps',color:'#f472b6'},
  upper_pull:{name:'Upper body — pull',goal:'Back · Biceps · Rear delts',color:'#a78bfa'},
  rest:{name:'Rest & recovery',goal:'Sleep · Hydration · Light movement',color:'#94a3b8'}
};
const CAT_MAP={strength_lower:['Lower Body'],upper_push:['Upper Push'],upper_pull:['Upper Pull'],aerobic:[]};
const DAY_ABBR=['Su','Mo','Tu','We','Th','Fr','Sa'];

// ── AUTH ──────────────────────────────────────────────────
async function loadUsers(){
  try{
    const users=await sbGet('app_users','select=id,display_name,role&order=display_name');
    allUsers=users||[];
    renderUserGrid();
  }catch(e){
    document.getElementById('user-grid').innerHTML='<div style="color:var(--red);font-size:13px;text-align:center;grid-column:span 2">Error: '+e.message+'</div>';
  }
}

function renderUserGrid(){
  const grid=document.getElementById('user-grid');
  if(!allUsers.length){grid.innerHTML='<div style="color:var(--slate);font-size:13px;text-align:center;grid-column:span 2">No users found</div>';return;}
  grid.innerHTML=allUsers.map(u=>`<button class="user-btn" onclick="selectUser('${u.id}','${u.display_name}')">
    <div class="user-avatar-lg">${u.display_name[0].toUpperCase()}</div>
    <div class="user-name">${u.display_name}</div>
    <div class="user-role">${u.role==='admin'?'★ Admin':'Member'}</div>
  </button>`).join('');
}

function selectUser(id,name){
  selectedUserId=id;
  document.querySelectorAll('.user-btn').forEach(b=>b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  pinEntry='';updatePinDots();
  document.getElementById('pin-label').textContent='PIN for '+name;
  document.getElementById('pin-section').style.display='block';
  document.getElementById('auth-msg').textContent='';
  document.getElementById('auth-msg').className='auth-msg';
}

function backToUsers(){
  document.getElementById('pin-section').style.display='none';
  selectedUserId=null;pinEntry='';
  document.querySelectorAll('.user-btn').forEach(b=>b.classList.remove('selected'));
}

function pinPress(d){if(pinEntry.length>=4)return;pinEntry+=d;updatePinDots();if(pinEntry.length===4)setTimeout(checkPin,150);}
function pinDel(){pinEntry=pinEntry.slice(0,-1);updatePinDots();}
function pinClear(){pinEntry='';updatePinDots();}
function updatePinDots(){for(let i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('filled',i<pinEntry.length);}

async function sha256(str){
  const data=new TextEncoder().encode(str);
  const buf=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkPin(){
  try{
    const hash=await sha256(pinEntry);
    const result=await sbGet('app_users','select=id,display_name,role&id=eq.'+selectedUserId+'&pin_hash=eq.'+encodeURIComponent(hash));
    if(result&&result.length>0){
      currentUser=result[0];
      localStorage.setItem('pf_user',JSON.stringify(currentUser));
      bootApp();
    }else{
      document.getElementById('auth-msg').textContent='Incorrect PIN — try again';
      document.getElementById('auth-msg').className='auth-msg error';
      pinEntry='';updatePinDots();
    }
  }catch(e){
    document.getElementById('auth-msg').textContent='Error: '+e.message;
    document.getElementById('auth-msg').className='auth-msg error';
    pinEntry='';updatePinDots();
  }
}

function handleSignOut(){
  localStorage.removeItem('pf_user');
  currentUser=null;
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  backToUsers();
  document.getElementById('dropdown').classList.remove('open');
}

// ── CHANGE PIN ────────────────────────────────────────────
function showChangePin(){
  document.getElementById('dropdown').classList.remove('open');
  let step=1,newPin='';
  function render(){
    const labels={1:'Enter your current PIN',2:'Enter new PIN',3:'Confirm new PIN'};
    document.getElementById('page-content').innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem">
        <button class="btn-sm" onclick="showTab('today')">← Back</button>
        <span style="font-size:16px;font-weight:600;color:var(--white)">Change PIN</span>
      </div>
      <div class="card" style="text-align:center">
        <div class="pin-label" style="margin-bottom:16px">${labels[step]}</div>
        <div class="pin-dots" style="display:flex;justify-content:center;gap:12px;margin-bottom:16px">
          ${[0,1,2,3].map(i=>`<div class="pin-dot${i<pinEntry.length?' filled':''}"></div>`).join('')}
        </div>
        <div class="pin-pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto">
          ${['1','2','3','4','5','6','7','8','9','⌫','0','✕'].map(k=>
            `<button class="pin-key" onclick="cpPress('${k}')">${k}</button>`).join('')}
        </div>
        <div class="auth-msg error" id="cp-msg" style="margin-top:12px"></div>
      </div>`;
    pinEntry='';
  }
  window.cpPress=async function(k){
    if(k==='⌫'){pinEntry=pinEntry.slice(0,-1);}
    else if(k==='✕'){pinEntry='';}
    else if(pinEntry.length<4){pinEntry+=k;}
    // Update dots
    document.querySelectorAll('.pin-dot').forEach((d,i)=>d.classList.toggle('filled',i<pinEntry.length));
    if(pinEntry.length<4)return;
    await new Promise(r=>setTimeout(r,150));
    if(step===1){
      const hash=await sha256(pinEntry);
      const res=await sbGet('app_users','select=id&id=eq.'+currentUser.id+'&pin_hash=eq.'+encodeURIComponent(hash));
      if(!res||!res.length){document.getElementById('cp-msg').textContent='Incorrect PIN';pinEntry='';document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('filled'));return;}
      step=2;newPin='';render();
    }else if(step===2){
      newPin=pinEntry;step=3;render();
    }else if(step===3){
      if(pinEntry!==newPin){document.getElementById('cp-msg').textContent='PINs do not match — try again';step=2;newPin='';render();return;}
      const hash=await sha256(newPin);
      await sbPatch('app_users','id=eq.'+currentUser.id,{pin_hash:hash});
      showToast('PIN changed ✓');
      showTab('today');
    }
  };
  render();
}

// ── BOOT ──────────────────────────────────────────────────
async function bootApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('user-name-display').textContent=currentUser.display_name.split(' ')[0];
  document.getElementById('user-avatar').textContent=currentUser.display_name[0].toUpperCase();
  if(currentUser.role==='admin'){
    document.getElementById('admin-menu-item').style.display='flex';
    document.getElementById('add-user-item').style.display='flex';
  }
  document.getElementById('page-content').innerHTML='<div class="loading"><div class="spinner"></div> Loading…</div>';
  try{
    await Promise.all([loadExercises(),loadTodayCompletions(),loadAllCompletions(),loadPlannerOverrides(),loadSessionLogs()]);
    updateDoneCount();
    showTab('today');
  }catch(e){
    document.getElementById('page-content').innerHTML='<div style="padding:2rem;color:var(--red);font-size:13px"><b>Error:</b> '+e.message+'</div>';
  }
}

// ── DATA ──────────────────────────────────────────────────
async function loadExercises(){
  const data=await sbGet('exercises','select=*&order=sort_order');
  exerciseLibrary={};
  (data||[]).forEach(ex=>{if(!exerciseLibrary[ex.category])exerciseLibrary[ex.category]=[];exerciseLibrary[ex.category].push(ex);});
}

async function loadTodayCompletions(){
  const today=dateKey(new Date());
  const data=await sbGet('exercise_completions','select=exercise_id&user_id=eq.'+currentUser.id+'&date=eq.'+today);
  todayCompletions={};
  (data||[]).forEach(r=>{todayCompletions[r.exercise_id]=true;});
}

async function loadAllCompletions(){
  const data=await sbGet('exercise_completions','select=date,exercise_id,exercise_name,category,workout_type&user_id=eq.'+currentUser.id+'&order=date.desc&limit=500');
  allCompletions=data||[];
}

async function loadPlannerOverrides(){
  const data=await sbGet('planner_overrides','select=date,workout_type&user_id=eq.'+currentUser.id);
  plannerOverrides={};
  (data||[]).forEach(r=>{plannerOverrides[r.date]=r.workout_type;});
}

async function loadSessionLogs(){
  const data=await sbGet('session_logs','select=date,notes&user_id=eq.'+currentUser.id);
  sessionLogs={};
  (data||[]).forEach(r=>{sessionLogs[r.date]=r.notes;});
}

function updateDoneCount(){
  const count=Object.keys(todayCompletions).length;
  document.getElementById('done-count').textContent=count;
}

// ── HELPERS ───────────────────────────────────────────────
function dateKey(d){return d.toISOString().slice(0,10);}
function getWorkoutType(date){
  const key=dateKey(date);
  if(plannerOverrides[key])return plannerOverrides[key];
  const base=new Date(2024,0,7);
  const diff=Math.floor((date-base)/86400000);
  return SCHEDULE[((diff%7)+7)%7];
}
function getWeekNum(date){const base=new Date(2024,0,7);return Math.floor((date-base)/(7*86400000));}
function rotateExercises(category,weekNum,count){
  const pool=(exerciseLibrary[category]||[]).filter(e=>e.active);
  if(!pool.length)return[];
  const start=(weekNum*count)%pool.length;
  const result=[];
  for(let i=0;i<Math.min(count,pool.length);i++)result.push(pool[(start+i)%pool.length]);
  return result;
}
function buildWorkout(type,date){
  const wn=getWeekNum(date);
  return{
    warmup:rotateExercises('Warm-Up',wn,6),
    core:rotateExercises('Core',wn,3),
    strength:(CAT_MAP[type]||[]).flatMap(cat=>rotateExercises(cat,wn,6)),
    cooldown:rotateExercises('Cool-Down',wn,5)
  };
}
function getWeekStart(offset=0){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay()+offset*7);return d;}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function toggleDropdown(){document.getElementById('dropdown').classList.toggle('open');}
document.addEventListener('click',e=>{if(!e.target.closest('#profile-btn')&&!e.target.closest('#dropdown'))document.getElementById('dropdown').classList.remove('open');});

// ── TABS ──────────────────────────────────────────────────
function showTab(name){
  currentTab=name;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-'+name)?.classList.add('active');
  ({today:renderToday,week:renderWeek,planner:renderPlanner,library:renderLibrary,progress:renderProgress})[name]?.();
}

// ── TODAY ─────────────────────────────────────────────────
function renderToday(){
  const today=new Date();today.setHours(0,0,0,0);
  const key=dateKey(today),type=getWorkoutType(today),meta=WORKOUT_META[type];
  const log=sessionLogs[key]||'';

  let html=`<div class="today-hero">
    <div class="today-date">${today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
    <div class="today-workout">${meta.name}</div>
    <div class="today-goal" style="color:${meta.color}">${meta.goal}</div>
  </div>`;

  if(type==='rest'){
    html+=`<div class="rest-card"><div class="rest-emoji">😴</div><div>Rest day — sleep well, hydrate, recover</div></div>`;
  }else{
    const workout=buildWorkout(type,today);
    const totalEx=workout.warmup.length+workout.core.length+workout.strength.length+workout.cooldown.length;
    const doneEx=Object.keys(todayCompletions).length;
    html+=`<div class="session-progress">
      <div class="progress-header">
        <span class="progress-title">Today's progress</span>
        <span class="progress-count">${doneEx} / ${totalEx} exercises</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${totalEx?Math.round(doneEx/totalEx*100):0}%"></div>
      </div>
    </div>`;
    html+=renderWorkoutSections(workout,type,today);
    html+=`<div class="card"><div class="card-title">Session notes</div>
      <textarea class="log-area" id="log-area" placeholder="How did it go? Any modifications…">${log}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn-sm btn-teal" onclick="saveLog('${key}')">Save notes</button>
      </div></div>`;
  }
  document.getElementById('page-content').innerHTML=html;
}

function renderWorkoutSections(workout,type,date){
  let html='';
  const key=dateKey(date||new Date());
  const sections=[
    {label:'Warm-up',color:'#60a5fa',items:workout.warmup},
    {label:'Core',color:'#f59e0b',items:workout.core},
    {label:'Strength',color:'#f472b6',items:workout.strength},
    {label:'Cool-down',color:'#4ade80',items:workout.cooldown}
  ];
  sections.forEach(s=>{
    if(!s.items.length)return;
    html+=`<div class="section-label"><span class="section-dot" style="background:${s.color}"></span>${s.label}</div>`;
    s.items.forEach(ex=>{
      const meta=[ex.sets?ex.sets+' sets':'',ex.reps].filter(Boolean).join(' · ');
      const isChecked=todayCompletions[ex.id];
      const isToday=date&&dateKey(date)===dateKey(new Date());
      if(isToday){
        html+=`<div class="ex-card${isChecked?' checked':''}">
          <button class="ex-checkbox" onclick="toggleExercise('${ex.id}','${ex.name.replace(/'/g,"\\'")}','${ex.category}','${type||''}','${key}')" style="border:none;cursor:pointer;background:none;padding:0;flex-shrink:0">
            <span class="ex-check-icon">✓</span>
          </button>
          <div class="ex-body" onclick="toggleExercise('${ex.id}','${ex.name.replace(/'/g,"\\'")}','${ex.category}','${type||''}','${key}')">
            <div class="ex-name">${ex.name}</div>
            ${meta?`<div class="ex-meta">${meta}</div>`:''}
            ${ex.notes?`<div class="ex-notes">${ex.notes}</div>`:''}
          </div>
        </div>`;
      }else{
        html+=`<div class="ex-card" style="cursor:default">
          <div class="ex-body">
            <div class="ex-name">${ex.name}</div>
            ${meta?`<div class="ex-meta">${meta}</div>`:''}
            ${ex.notes?`<div class="ex-notes">${ex.notes}</div>`:''}
          </div>
        </div>`;
      }
    });
  });
  return html;
}

async function toggleExercise(exId,exName,category,workoutType,dateStr){
  if(todayCompletions[exId]){
    await sbDelete('exercise_completions','user_id=eq.'+currentUser.id+'&date=eq.'+dateStr+'&exercise_id=eq.'+exId);
    delete todayCompletions[exId];
  }else{
    await sbPost('exercise_completions',{user_id:currentUser.id,date:dateStr,exercise_id:exId,exercise_name:exName,category:category,workout_type:workoutType},'resolution=merge-duplicates');
    todayCompletions[exId]=true;
  }
  // Update allCompletions cache
  await loadAllCompletions();
  updateDoneCount();
  // Re-render just the exercise card without full page refresh
  renderToday();
}

async function saveLog(key){
  const notes=document.getElementById('log-area')?.value||'';
  await sbPost('session_logs',{user_id:currentUser.id,date:key,notes,updated_at:new Date().toISOString()},'resolution=merge-duplicates');
  sessionLogs[key]=notes;showToast('Notes saved ✓');
}

// ── WEEK ──────────────────────────────────────────────────
function renderWeek(){
  const ws=getWeekStart(weekOffset),we=new Date(ws);we.setDate(we.getDate()+6);
  const today=new Date();today.setHours(0,0,0,0);

  // Count completions per day
  const dayCounts={};
  allCompletions.forEach(c=>{dayCounts[c.date]=(dayCounts[c.date]||0)+1;});

  let html=`<div class="week-nav">
    <button class="icon-btn" onclick="changeWeek(-1)">‹</button>
    <span class="week-label">${ws.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${we.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>
    <button class="icon-btn" onclick="changeWeek(1)">›</button>
    <button class="btn-sm" onclick="weekOffset=0;selectedDay=null;renderWeek()">Today</button>
  </div><div class="day-grid">`;

  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);
    const k=dateKey(d),type=getWorkoutType(d);
    const isToday=d.getTime()===today.getTime();
    const count=dayCounts[k]||0;
    const isSel=selectedDay&&dateKey(selectedDay)===k,isRest=type==='rest';
    html+=`<div class="day-cell${isToday?' today':''}${count>0?' has-activity':''}${isSel?' selected':''}${isRest?' rest-day':''}" onclick="selectDay(${d.getTime()})">
      <div class="day-abbr">${DAY_ABBR[d.getDay()]}</div>
      <div class="day-num">${d.getDate()}</div>
      ${count>0?`<div class="day-count">${count}✓</div>`:(!isRest?'<div class="day-dot"></div>':'')}
    </div>`;
  }
  html+='</div>';

  if(selectedDay){
    const k=dateKey(selectedDay),type=getWorkoutType(selectedDay),meta=WORKOUT_META[type];
    const dayCount=dayCounts[k]||0;
    html+=`<div class="card">
      <div style="font-size:14px;font-weight:600;color:var(--white);margin-bottom:2px">${selectedDay.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
      <div style="font-size:12px;color:${meta.color};margin-bottom:4px">${meta.name}</div>
      ${dayCount>0?`<div style="font-size:12px;color:var(--green);margin-bottom:12px">✓ ${dayCount} exercises completed</div>`:''}`;
    if(type!=='rest'){
      const workout=buildWorkout(type,selectedDay);
      html+=renderWorkoutSections(workout,type,selectedDay);
    }else{
      html+=`<div class="rest-card"><div class="rest-emoji">😴</div><div>Rest day</div></div>`;
    }
    html+='</div>';
  }
  document.getElementById('page-content').innerHTML=html;
}

function changeWeek(dir){weekOffset+=dir;selectedDay=null;renderWeek();}
function selectDay(ts){selectedDay=new Date(ts);renderWeek();}

// ── PLANNER ───────────────────────────────────────────────
function renderPlanner(){
  const ws=getWeekStart(weekOffset),types=Object.keys(WORKOUT_META);
  let html=`<div class="card"><div class="card-title">Weekly planner</div>
    <p style="font-size:12px;color:var(--slate);margin-bottom:1rem">Override workout assignments for any day.</p>`;
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);
    const k=dateKey(d),cur=plannerOverrides[k]||getWorkoutType(d);
    html+=`<div class="planner-row">
      <span class="planner-day">${DAY_ABBR[d.getDay()]}<br><span style="font-size:10px">${d.getDate()}</span></span>
      <select class="planner-select" onchange="setPlannerOverride('${k}',this.value)">
        ${types.map(t=>`<option value="${t}"${t===cur?' selected':''}>${WORKOUT_META[t].name}</option>`).join('')}
      </select>
      ${plannerOverrides[k]?`<button class="btn-sm" onclick="clearPlannerOverride('${k}')" style="padding:6px 8px;font-size:11px">✕</button>`:''}
    </div>`;
  }
  html+='</div>';
  document.getElementById('page-content').innerHTML=html;
}

async function setPlannerOverride(key,value){
  await sbPost('planner_overrides',{user_id:currentUser.id,date:key,workout_type:value},'resolution=merge-duplicates');
  plannerOverrides[key]=value;showToast('Planner updated ✓');
}

async function clearPlannerOverride(key){
  await sbDelete('planner_overrides','user_id=eq.'+currentUser.id+'&date=eq.'+key);
  delete plannerOverrides[key];renderPlanner();
}

// ── LIBRARY ───────────────────────────────────────────────
function renderLibrary(){
  const cats=['Warm-Up','Core','Lower Body','Upper Push','Upper Pull','Cool-Down'];
  const allEx=cats.flatMap(c=>exerciseLibrary[c]||[]);
  const total=allEx.length,active=allEx.filter(e=>e.active).length;
  let html=`<div class="lib-stats">
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-lbl">Total</div></div>
    <div class="stat-box"><div class="stat-num">${active}</div><div class="stat-lbl">Active</div></div>
    <div class="stat-box"><div class="stat-num">${cats.length}</div><div class="stat-lbl">Categories</div></div>
  </div>`;
  if(currentUser.role==='admin'){
    html+=`<div class="import-zone" onclick="document.getElementById('xlsx-import').click()">
      <div style="font-size:28px;margin-bottom:8px">📥</div>
      <div style="font-size:13px;font-weight:500">Import from Excel</div>
      <div style="font-size:12px;color:var(--slate);margin-top:4px">Upload Exercise_Library.xlsx to update</div>
      <input type="file" id="xlsx-import" accept=".xlsx,.xls" style="display:none" onchange="importXLSX(event)">
    </div>`;
  }
  cats.forEach(cat=>{
    const exs=exerciseLibrary[cat]||[],activeCount=exs.filter(e=>e.active).length;
    html+=`<div class="cat-header">${cat} <span style="color:var(--slate);font-weight:400;font-size:10px">${activeCount} active / ${exs.length} total</span></div>`;
    exs.forEach(ex=>{
      const meta=[ex.sets?ex.sets+' sets':'',ex.reps].filter(Boolean).join(' · ');
      html+=`<div class="lib-ex-row${ex.active?'':' inactive'}">
        <div class="lib-ex-info"><div class="lib-ex-name">${ex.name}</div>${meta?`<div class="lib-ex-meta">${meta}</div>`:''}</div>
        ${currentUser.role==='admin'?`
          <div style="display:flex;gap:6px;flex-shrink:0;align-items:center">
            <button class="toggle-btn ${ex.active?'active-ex':'inactive-ex'}" onclick="toggleExLib('${ex.id}',${!ex.active})">${ex.active?'Active':'Inactive'}</button>
            <button class="toggle-btn inactive-ex" onclick="showEditExercise('${ex.id}')" style="border-color:var(--slate);padding:3px 7px">✏️</button>
          </div>`:''}
      </div>`;
    });
  });
  document.getElementById('page-content').innerHTML=html;
}

async function toggleExLib(id,newActive){
  await sbPatch('exercises','id=eq.'+id,{active:newActive,updated_at:new Date().toISOString()});
  await loadExercises();renderLibrary();
  showToast(newActive?'Exercise activated ✓':'Exercise paused');
}

async function importXLSX(evt){
  const file=evt.target.files[0];if(!file)return;
  if(!window.XLSX){await new Promise(res=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;document.head.appendChild(s);});}
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      let added=0,updated=0;
      for(const row of rows){
        const cat=(row['Category']||'').trim(),name=(row['Exercise Name']||row['Exercise']||'').trim();
        if(!cat||!name)continue;
        const sets=String(row['Sets']||'').trim(),reps=String(row['Reps / Duration']||row['Reps']||'').trim();
        const notes=String(row['Notes / Cues']||row['Notes']||'').trim();
        const active=String(row['Active']||'Yes').trim().toLowerCase()!=='no';
        const existing=(exerciseLibrary[cat]||[]).find(e=>e.name.toLowerCase()===name.toLowerCase());
        if(existing){await sbPatch('exercises','id=eq.'+existing.id,{sets,reps,notes,active,updated_at:new Date().toISOString()});updated++;}
        else{await sbPost('exercises',{category:cat,name,sets,reps,notes,active,sort_order:999});added++;}
      }
      await loadExercises();renderLibrary();
      showToast(`${added} added, ${updated} updated ✓`);
    }catch(err){showToast('Error: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

// ── PROGRESS ──────────────────────────────────────────────
function renderProgress(){
  const now=new Date();now.setHours(23,59,59,999);
  const cutoff=new Date(now);cutoff.setDate(cutoff.getDate()-progressPeriod+1);cutoff.setHours(0,0,0,0);

  const periodCompletions=allCompletions.filter(c=>new Date(c.date+'T00:00:00')>=cutoff);
  const activeDays=new Set(periodCompletions.map(c=>c.date));

  // Count by exercise
  const exCounts={};
  periodCompletions.forEach(c=>{
    if(!exCounts[c.exercise_name])exCounts[c.exercise_name]={count:0,category:c.category};
    exCounts[c.exercise_name].count++;
  });
  const maxCount=Math.max(...Object.values(exCounts).map(v=>v.count),1);

  // All-time stats
  const allDays=new Set(allCompletions.map(c=>c.date));

  let html=`<div class="prog-stats">
    <div class="stat-box"><div class="stat-num">${allDays.size}</div><div class="stat-lbl">Total days</div></div>
    <div class="stat-box"><div class="stat-num">${allCompletions.length}</div><div class="stat-lbl">Total exercises</div></div>
    <div class="stat-box"><div class="stat-num">${activeDays.size}</div><div class="stat-lbl">Days this period</div></div>
  </div>

  <div class="period-tabs">
    <button class="period-tab${progressPeriod===7?' active':''}" onclick="progressPeriod=7;renderProgress()">7 days</button>
    <button class="period-tab${progressPeriod===30?' active':''}" onclick="progressPeriod=30;renderProgress()">30 days</button>
    <button class="period-tab${progressPeriod===90?' active':''}" onclick="progressPeriod=90;renderProgress()">90 days</button>
  </div>`;

  if(Object.keys(exCounts).length===0){
    html+=`<div class="empty-state">No exercises completed in this period.<br>Check exercises off during your workout to start tracking.</div>`;
  }else{
    html+=`<div class="card"><div class="card-title">Exercises completed — last ${progressPeriod} days</div>`;
    Object.entries(exCounts)
      .sort((a,b)=>b[1].count-a[1].count)
      .forEach(([name,data])=>{
        const pct=Math.round(data.count/maxCount*100);
        html+=`<div class="ex-history-row">
          <div style="flex:1">
            <div class="ex-history-name">${name}</div>
            <div class="ex-history-bar"><div class="ex-history-bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="ex-history-count">${data.count}×</div>
        </div>`;
      });
    html+='</div>';

    // Active days breakdown
    html+=`<div class="card"><div class="card-title">Active days</div>`;
    const dayMap={};
    periodCompletions.forEach(c=>{
      if(!dayMap[c.date])dayMap[c.date]={count:0,type:c.workout_type};
      dayMap[c.date].count++;
    });
    Object.entries(dayMap).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([date,data])=>{
      const d=new Date(date+'T00:00:00');
      const meta=WORKOUT_META[data.type]||{name:data.type,color:'#94a3b8'};
      html+=`<div class="activity-day-row">
        <div>
          <div style="font-size:13px;font-weight:500;color:var(--white)">${d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div>
          <div style="font-size:11px;color:${meta.color}">${meta.name}</div>
        </div>
        <div style="color:var(--teal);font-weight:600;font-size:13px">${data.count} exercises</div>
      </div>`;
    });
    html+='</div>';
  }

  document.getElementById('page-content').innerHTML=html;
}

// ── ADMIN ─────────────────────────────────────────────────
function showEditExercise(exId){
  const cats=['Warm-Up','Core','Lower Body','Upper Push','Upper Pull','Cool-Down'];
  // Find exercise across all categories
  let ex=null;
  for(const cat of cats){
    ex=(exerciseLibrary[cat]||[]).find(e=>e.id===exId);
    if(ex)break;
  }
  if(!ex){showToast('Exercise not found');return;}
  document.getElementById('page-content').innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem">
      <button class="btn-sm" onclick="showTab('library')">← Back</button>
      <span style="font-size:16px;font-weight:600;color:var(--white)">Edit exercise</span>
    </div>
    <div class="card"><div class="admin-form">
      <select id="edit-cat">
        ${cats.map(c=>`<option value="${c}"${c===ex.category?' selected':''}>${c}</option>`).join('')}
      </select>
      <input type="text" id="edit-name" value="${ex.name.replace(/"/g,'&quot;')}" placeholder="Exercise name">
      <input type="text" id="edit-sets" value="${ex.sets||''}" placeholder="Sets (e.g. 3)">
      <input type="text" id="edit-reps" value="${ex.reps||''}" placeholder="Reps / Duration">
      <textarea id="edit-notes" placeholder="Notes / form cues…">${ex.notes||''}</textarea>
      <button class="btn-primary" onclick="saveEditExercise('${ex.id}')">Save changes</button>
    </div></div>
    <div class="card" style="border-color:rgba(248,113,113,0.3)">
      <div class="card-title" style="color:var(--red)">Danger zone</div>
      <p style="font-size:12px;color:var(--slate);margin-bottom:12px">Permanently delete this exercise. This cannot be undone. Consider deactivating instead if you may want it back.</p>
      <button class="btn-sm" style="border-color:var(--red);color:var(--red);width:100%" onclick="confirmDeleteExercise('${ex.id}','${ex.name.replace(/'/g,"\'")}')">Delete exercise</button>
    </div>`;
}

async function saveEditExercise(exId){
  const name=document.getElementById('edit-name').value.trim();
  const cat=document.getElementById('edit-cat').value;
  const sets=document.getElementById('edit-sets').value.trim();
  const reps=document.getElementById('edit-reps').value.trim();
  const notes=document.getElementById('edit-notes').value.trim();
  if(!name)return showToast('Exercise name required');
  await sbPatch('exercises','id=eq.'+exId,{name,category:cat,sets,reps,notes,updated_at:new Date().toISOString()});
  await loadExercises();
  showToast('Saved ✓');
  showTab('library');
}

function confirmDeleteExercise(exId,exName){
  document.getElementById('page-content').innerHTML+=`
    <div id="delete-confirm" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:400;padding:1.5rem">
      <div style="background:var(--navy2);border:1px solid var(--red);border-radius:var(--radius);padding:1.5rem;max-width:320px;width:100%">
        <div style="font-size:16px;font-weight:600;color:var(--white);margin-bottom:8px">Delete exercise?</div>
        <div style="font-size:13px;color:var(--slate);margin-bottom:1.5rem">"${exName}" will be permanently removed from the library and all history.</div>
        <div style="display:flex;gap:8px">
          <button class="btn-sm" style="flex:1" onclick="document.getElementById('delete-confirm').remove()">Cancel</button>
          <button class="btn-sm" style="flex:1;border-color:var(--red);color:var(--red)" onclick="deleteExercise('${exId}')">Delete</button>
        </div>
      </div>
    </div>`;
}

async function deleteExercise(exId){
  await sbDelete('exercises','id=eq.'+exId);
  await loadExercises();
  showToast('Exercise deleted');
  showTab('library');
}

function showAdminPanel(){
  document.getElementById('dropdown').classList.remove('open');
  const cats=['Warm-Up','Core','Lower Body','Upper Push','Upper Pull','Cool-Down'];
  document.getElementById('page-content').innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem">
      <button class="btn-sm" onclick="showTab('library')">← Back</button>
      <span style="font-size:16px;font-weight:600;color:var(--white)">Add exercise</span>
    </div>
    <div class="card"><div class="admin-form">
      <select id="new-cat">${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      <input type="text" id="new-name" placeholder="Exercise name">
      <input type="text" id="new-sets" placeholder="Sets (e.g. 3)">
      <input type="text" id="new-reps" placeholder="Reps / Duration">
      <textarea id="new-notes" placeholder="Notes / form cues…"></textarea>
      <button class="btn-primary" onclick="addExercise()">Add to library</button>
    </div></div>`;
}

async function addExercise(){
  const cat=document.getElementById('new-cat').value;
  const name=document.getElementById('new-name').value.trim();
  const sets=document.getElementById('new-sets').value.trim();
  const reps=document.getElementById('new-reps').value.trim();
  const notes=document.getElementById('new-notes').value.trim();
  if(!name)return showToast('Exercise name required');
  await sbPost('exercises',{category:cat,name,sets,reps,notes,active:true,sort_order:999});
  await loadExercises();showToast(name+' added ✓');
  document.getElementById('new-name').value='';
  document.getElementById('new-sets').value='';
  document.getElementById('new-reps').value='';
  document.getElementById('new-notes').value='';
}

function showAddUser(){
  document.getElementById('dropdown').classList.remove('open');
  document.getElementById('page-content').innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem">
      <button class="btn-sm" onclick="showTab('today')">← Back</button>
      <span style="font-size:16px;font-weight:600;color:var(--white)">Add family member</span>
    </div>
    <div class="card"><div class="admin-form">
      <input type="text" id="new-user-name" placeholder="Name (e.g. Sarah)">
      <input type="text" id="new-user-pin" placeholder="4-digit PIN" maxlength="4" inputmode="numeric">
      <button class="btn-primary" onclick="addUser()">Add member</button>
    </div></div>`;
}

async function addUser(){
  const name=document.getElementById('new-user-name').value.trim();
  const pin=document.getElementById('new-user-pin').value.trim();
  if(!name)return showToast('Name required');
  if(pin.length!==4)return showToast('PIN must be exactly 4 digits');
  if(!/^\d{4}$/.test(pin))return showToast('PIN must be 4 numbers');
  try{
    const hash=await sha256(pin);
    await sbPost('app_users',{display_name:name,pin_hash:hash,role:'member'});
    showToast(name+' added ✓');
    document.getElementById('new-user-name').value='';
    document.getElementById('new-user-pin').value='';
    showTab('today');
  }catch(e){
    showToast('Error: '+e.message);
  }
}

// ── INIT ──────────────────────────────────────────────────
async function init(){
  const saved=localStorage.getItem('pf_user');
  if(saved){
    try{currentUser=JSON.parse(saved);await bootApp();return;}
    catch(e){localStorage.removeItem('pf_user');}
  }
  await loadUsers();
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
init();
</script>
